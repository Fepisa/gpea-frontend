<form [formGroup]="formulario" class="role-form">
  <div class="role-titulo">Permissão de acesso</div>
  <div class="role-conteudo">
    <mat-radio-group aria-label="Selecione uma opção" formControlName="role" *ngIf="userRoleAdmin" class="role-opcoes">
      <mat-radio-button value="Viewer">Leitor</mat-radio-button>
      <mat-radio-button value="Admin">Administrador</mat-radio-button>
    </mat-radio-group>
    <span class="role-badge" *ngIf="!userRoleAdmin">
      <mat-icon>shield</mat-icon> {{ formulario.get('role')?.value }}
    </span>
    <button mat-flat-button type="button" class="gp-btn-primary role-salvar" (click)="updateRole()" *ngIf="userRoleAdmin">
      <mat-icon>save</mat-icon> Atualizar
    </button>
  </div>
</form>
