<div class="inner-content">
    <div>
      <button mat-raised-button type="button" class="btn btn-success pull-right" (click)="novoUser()">
          Novo Usuário
      </button>
      <button mat-raised-button type="button" class="btn btn-success pull-right" (click)="laudos()">
          Laudos
      </button>
      <button mat-raised-button type="button" class="btn btn-success pull-right" (click)="logout()">
          Sair
      </button>
    </div>
    <div class="table-container mat-elevation-z8">
      <table mat-table [dataSource]="dataSource" class="table-result">
  
          <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Nome</th>
  
              <td mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>
  
          <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>E-mail</th>
  
              <td mat-cell *matCellDef="let element"> {{element.email}} </td>
          </ng-container>
    
          <ng-container matColumnDef="acoes">
              <th mat-header-cell *matHeaderCellDef>Ações</th>
              <td mat-cell *matCellDef="let element">
  
                  <button mat-icon-button title="Editar" (click)="editarUser(element.id)">
                      <mat-icon aria-label="Botão de Edição">
                          mode
                      </mat-icon>
                  </button>
              </td>
          </ng-container>
        
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
  
      <ngx-skeleton-loader *ngIf="!contentLoaded"
                           count="5" animation="progress"
                           [theme]="{
                           height: '48px',
                           'background-color': '#E4E4E4',
                           'margin-bottom': '40px'
      }">
  
      </ngx-skeleton-loader>
  
      <mat-paginator #paginator *ngIf="isPagination"
          showFirstLastButtons
          [pageSizeOptions]="[5, 10, 20, 50, 100]">
      </mat-paginator>
    </div>
  </div>
