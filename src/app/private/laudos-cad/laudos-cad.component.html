<div class="inner-content">
    <form [formGroup]="formulario" class="cad-form">
      <mat-form-field class="full-input">
        <input matInput placeholder="Código" formControlName="codigo">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Descrição" formControlName="descricao">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Capacidade Un." formControlName="capacidade">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Massa" formControlName="massa">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Quantidade" formControlName="quantidade">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Tipo" formControlName="tipo">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Empresa" formControlName="empresa">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Local Geral" formControlName="local_geral">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Local Específico" formControlName="local_especifico">
      </mat-form-field>
      <mat-form-field class="full-input">
        <mat-label>Data</mat-label>
        <input matInput [matDatepicker]="dpData" formControlName="data">
        <mat-datepicker-toggle matSuffix [for]="dpData"></mat-datepicker-toggle>
        <mat-datepicker #dpData></mat-datepicker>
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Contrato" formControlName="contrato">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="CREA" formControlName="crea">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="ART" formControlName="art">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Capacidade Un." formControlName="capacidade_2">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Massa" formControlName="massa_2">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Quantidade" formControlName="quantidade_2">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Tipo" formControlName="tipo_2">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Empresa" formControlName="empresa_2">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Local Geral" formControlName="local_geral_2">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Local Específico" formControlName="local_especifico_2">
      </mat-form-field>
      <mat-form-field class="full-input">
        <mat-label>Data</mat-label>
        <input matInput [matDatepicker]="dpData2" formControlName="data_2">
        <mat-datepicker-toggle matSuffix [for]="dpData2"></mat-datepicker-toggle>
        <mat-datepicker #dpData2></mat-datepicker>
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Contrato" formControlName="contrato_2">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="CREA" formControlName="crea_2">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="ART" formControlName="art_2">
      </mat-form-field>
      <div>
        <button mat-raised-button name="action" (click)="save()">
            <mat-icon>save</mat-icon> Salvar
        </button>
        <button mat-raised-button name="limpar" (click)="reset()">
            <mat-icon>delete</mat-icon> Limpar
        </button>
        <button mat-raised-button name="voltar" (click)="voltar()">
            <mat-icon>arrow_back</mat-icon> Voltar
        </button>
      </div>
    </form>
</div>
