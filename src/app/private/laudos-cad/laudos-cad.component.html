<div class="inner-content">
    <form [formGroup]="formulario" class="cad-form">
      <mat-form-field class="full-input">
        <input matInput placeholder="Código" formControlName="codigo">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Descrição" formControlName="descricao">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Capacidade Un." formControlName="capacidade">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Massa" formControlName="massa">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Quantidade" formControlName="quantidade">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Tipo" formControlName="tipo">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Local Geral" formControlName="local_geral">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Local Específico" formControlName="local_especifico">
      </mat-form-field>
      <mat-form-field class="full-input">
        <mat-label>Data</mat-label>
        <input matInput [matDatepicker]="dpData" formControlName="data">
        <mat-datepicker-toggle matSuffix [for]="dpData"></mat-datepicker-toggle>
        <mat-datepicker #dpData></mat-datepicker>
      </mat-form-field>
      <mat-form-field class="full-input">
        <mat-label>Validade</mat-label>
        <input matInput [matDatepicker]="dpValidade" formControlName="validade" (dateChange)="verificarValidade()">
        <mat-datepicker-toggle matSuffix [for]="dpValidade"></mat-datepicker-toggle>
        <mat-datepicker #dpValidade></mat-datepicker>
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Relatório" formControlName="relatorio">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Resp. Técnico" formControlName="responsavel_tecnico">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Contratante" formControlName="contratante">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Contratada" formControlName="contratada">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Observação" formControlName="observacao"
          [ngStyle]="{color: colorObs, fontWeight: 'bold' }">
      </mat-form-field>
      <div>
        <button mat-raised-button name="action" (click)="save()">
            <mat-icon>save</mat-icon> Salvar
        </button>
        <button mat-raised-button name="limpar" (click)="reset()">
            <mat-icon>delete</mat-icon> Limpar
        </button>
        <button mat-raised-button name="voltar" (click)="voltar()">
            <mat-icon>arrow_back</mat-icon> Voltar
        </button>
      </div>
    </form>
</div>
