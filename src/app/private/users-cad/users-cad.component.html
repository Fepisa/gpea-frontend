<div class="inner-content">
    <form [formGroup]="formulario" class="cad-form">
      <mat-form-field class="full-input">
        <input matInput placeholder="Nome" formControlName="name">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="E-mail" formControlName="email" type="email">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Senha" [type]="hide ? 'password' : 'text'" formControlName="password">
        <mat-icon matSuffix (click)="hide = !hide">
            {{ hide ? 'visibility' : 'visibility_off'}}
        </mat-icon>
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Confirmar Senha" [type]="hide_c ? 'password' : 'text'" formControlName="c_password">
        <mat-icon matSuffix (click)="hide_c = !hide_c">
            {{ hide_c ? 'visibility' : 'visibility_off'}}
        </mat-icon>
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Empresa" formControlName="empresa">
      </mat-form-field>
      <mat-form-field class="full-input">
        <input matInput placeholder="Local" formControlName="local">
      </mat-form-field>
      <div>
        <button mat-raised-button name="action" (click)="save()">
            <mat-icon>save</mat-icon> Salvar
        </button>
        <button mat-raised-button name="limpar" (click)="reset()">
            <mat-icon>delete</mat-icon> Limpar
        </button>
        <button mat-raised-button name="voltar" (click)="voltar()">
            <mat-icon>arrow_back</mat-icon> Voltar
        </button>
      </div>
    </form>
</div>
