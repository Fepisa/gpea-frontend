<div class="detalhe-titulo">Imagens do laudo</div>

<div class="galeria" *ngIf="dataSourceDetalhe?.data?.length; else semImagens">
  <div class="galeria-item" *ngFor="let element of dataSourceDetalhe.data">
    <a [attr.href]="element.image" target="_blank" rel="noopener" title="Abrir imagem em nova aba">
      <img [src]="element.image" alt="Imagem do laudo">
    </a>
    <button mat-mini-fab type="button" class="galeria-excluir" title="Excluir imagem"
      (click)="deleteImagem(element.id)" *ngIf="parentComponent?.userRoleAdmin">
      <mat-icon>delete_outline</mat-icon>
    </button>
  </div>
</div>

<ng-template #semImagens>
  <div class="sem-imagens">
    <mat-icon>image_not_supported</mat-icon>
    <span>Nenhuma imagem cadastrada para este laudo</span>
  </div>
</ng-template>
