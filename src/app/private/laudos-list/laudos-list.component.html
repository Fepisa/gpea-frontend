<div class="inner-content">
  <div>
    <button mat-raised-button type="button" class="btn btn-success pull-right" (click)="novoLaudo()"
        *ngIf="userRoleAdmin">
        Novo Laudo
    </button>
    <button mat-raised-button type="button" class="btn btn-success pull-right" (click)="importarLaudo()"
        *ngIf="userRoleAdmin">
        Importar Laudos
    </button>
    <button mat-raised-button type="button" class="btn btn-success pull-right" (click)="exportarLaudo()">
        Exportar Laudos
    </button>
    <button mat-raised-button type="button" class="btn btn-success pull-right" (click)="usuarios()">
        Usuários
    </button>
    <button mat-raised-button type="button" class="btn btn-success pull-right" (click)="logout()">
        Sair
    </button>
  </div>
  <div class="table-container mat-elevation-z8">
    <mat-table [dataSource]="dataSource" class="table-result">

        <ng-container matColumnDef="visualiza">
            <mat-header-cell *matHeaderCellDef></mat-header-cell>
            <mat-cell *matCellDef="let row; let index=index">
                <button mat-icon-button (click)="expandRow(index, row)">
                    <mat-icon aria-label="Botão de visualização">
                        add
                    </mat-icon>
                </button>
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="codigo">
            <mat-header-cell *matHeaderCellDef>Código</mat-header-cell>

            <mat-cell *matCellDef="let element"> {{element.codigo}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="descricao">
            <mat-header-cell *matHeaderCellDef>Descrição</mat-header-cell>

            <mat-cell *matCellDef="let element"> {{element.descricao}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="data">
            <mat-header-cell *matHeaderCellDef>Data</mat-header-cell>

            <mat-cell *matCellDef="let element"> {{element.data}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="acoes">
            <mat-header-cell *matHeaderCellDef>Ações</mat-header-cell>
            <mat-cell *matCellDef="let element">
                <button mat-icon-button title="Adicionar Imagem" (click)="fileUpload.click()" *ngIf="userRoleAdmin">
                    <mat-icon aria-label="Botão de Adicionar Imagem">
                        image
                    </mat-icon>
                </button>
                <button mat-icon-button title="Editar" (click)="editarLaudo(element.id)">
                    <mat-icon aria-label="Botão de Edição">
                        mode
                    </mat-icon>
                </button>
                <button mat-icon-button title="Excluir" (click)="deleteLaudo(element.id)" *ngIf="userRoleAdmin">
                    <mat-icon aria-label="Botão de Exclusão">
                        delete
                    </mat-icon>
                </button>
                <input type="file" style="display: none" (change)="onFileSelected(element.codigo, $event)" #fileUpload>
            </mat-cell>
        </ng-container>
      
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;" #matrow></mat-row>
    </mat-table>

    <ngx-skeleton-loader *ngIf="!contentLoaded"
                         count="5" animation="progress"
                         [theme]="{
                         height: '48px',
                         'background-color': '#E4E4E4',
                         'margin-bottom': '40px'
    }">

    </ngx-skeleton-loader>

    <mat-paginator #paginator *ngIf="isPagination"
        showFirstLastButtons
        [pageSizeOptions]="[5, 10, 20, 50, 100]">
    </mat-paginator>
  </div>
</div>
