<mat-grid-list cols="3">
  <mat-grid-tile></mat-grid-tile>
  <mat-grid-tile class="login-element">
    <div class="login-container">
      <div class="login-box-header">GPEA SCAN</div>
      <form [formGroup]="loginForm" (ngSubmit)="doLogin()">
        <div class="login-box-body">
          <mat-grid-list cols="9" rowHeight="75px">
            <mat-grid-tile [rowspan]="1" class="login-icon">
              <mat-icon>lock</mat-icon>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="7">
              <mat-form-field class="justifier">
                <input matInput placeholder="E-mail" formControlName="email" required>
              </mat-form-field>
            </mat-grid-tile>
          </mat-grid-list>
          <mat-grid-list cols="9" rowHeight="100px">
            <mat-grid-tile [rowspan]="1" class="login-icon">
              <mat-icon matSuffix (click)="hide = !hide">
                {{ hide ? 'visibility' : 'visibility_off'}}
              </mat-icon>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="7">
              <mat-form-field class="justifier">
                <input matInput placeholder="Senha" [type]="hide ? 'password' : 'text'"
                  formControlName="password" required>
              </mat-form-field>
            </mat-grid-tile>
          </mat-grid-list>
          <button mat-raised-button color="primary" class="login-button"
            type="submit" name="action">
            <mat-icon>input</mat-icon> Login
          </button>
        </div>
      </form>
    </div>
  </mat-grid-tile>
  <mat-grid-tile></mat-grid-tile>
</mat-grid-list>
